name: 'lockgate - npm lockfile diff gate'
description: 'Offline supply-chain review of package-lock.json changes in pull requests: integrity changes, git/tarball sources, new install scripts.'
author: 'ArisRhiannon'
branding: { icon: 'lock', color: 'red' }
inputs:
  base:
    description: 'Git ref to compare against (default: the PR base branch)'
    required: false
    default: ''
  lockfile:
    description: 'Path to package-lock.json'
    required: false
    default: 'package-lock.json'
  fail-on:
    description: 'Fail at/above this severity: info|low|medium|high|critical'
    required: false
    default: 'high'
  sarif:
    description: 'Also write lockgate.sarif for upload to code scanning'
    required: false
    default: 'false'
runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        LG_BASE: ${{ inputs.base }}
        LG_LOCK: ${{ inputs.lockfile }}
        LG_FAIL: ${{ inputs.fail-on }}
        LG_SARIF: ${{ inputs.sarif }}
        LG_PR_BASE: ${{ github.base_ref }}
      run: |
        base="${LG_BASE:-origin/${LG_PR_BASE}}"
        if [ "$LG_SARIF" = "true" ]; then
          node "$GITHUB_ACTION_PATH/bin/lockgate.js" --base "$base" --format sarif --output lockgate.sarif --fail-on critical "$LG_LOCK" || true
        fi
        node "$GITHUB_ACTION_PATH/bin/lockgate.js" --base "$base" --fail-on "$LG_FAIL" "$LG_LOCK"
